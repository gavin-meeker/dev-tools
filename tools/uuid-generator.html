<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <title>UUID Generator - Dev Tools</title>
  <link rel="stylesheet" href="../styles.css">
  <style>
    .uuid-display {
      font-family: monospace;
      font-size: 1.3rem;
      background: var(--color-bg);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: 0.75rem 1rem;
      margin-bottom: 1rem;
      user-select: all;
      cursor: pointer;
      word-break: break-all;
    }

    .uuid-display:hover {
      border-color: var(--color-accent);
    }

    .batch-output {
      font-family: monospace;
      font-size: 0.95rem;
      background: var(--color-bg);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: 0.75rem;
      white-space: pre-wrap;
      word-break: break-all;
      min-height: 60px;
      margin-top: 1rem;
      cursor: pointer;
    }

    .batch-output:hover {
      border-color: var(--color-accent);
    }

    .count-input {
      width: 70px;
      padding: 0.5rem;
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      font-size: 0.95rem;
      background: var(--color-bg);
      color: var(--color-text);
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <a class="back-link" href="../index.html"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg> Back</a>
    <a class="site-title" href="../index.html">Dev Tools</a>
    <span class="header-spacer"></span>
    <button class="theme-toggle" id="theme-toggle" title="Toggle theme"></button>
  </header>

  <main>
    <h1>UUID Generator</h1>
    <div class="tool-container">
      <label>UUID v4</label>
      <div class="output-wrap">
        <div class="uuid-display" id="single-uuid"></div>
        <button class="copy-icon" onclick="copyFrom('single-uuid')" title="Copy"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
      </div>

      <div class="btn-row">
        <button onclick="generateOne()">Generate</button>
      </div>

      <hr style="border: none; border-top: 1px solid var(--color-border); margin: 1.5rem 0;">

      <label>Batch Generate</label>
      <div class="btn-row" style="align-items: center;">
        <input type="number" class="count-input" id="batch-count" value="10" min="1" max="1000">
        <button onclick="generateBatch()">Generate</button>
      </div>
      <div class="output-wrap">
        <div class="batch-output" id="batch-output"></div>
        <button class="copy-icon" onclick="copyFrom('batch-output')" title="Copy"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
      </div>
    </div>
  </main>
<footer>Made by Gavin Meeker</footer>

  <script>
    function uuidv4() {
      return crypto.randomUUID();
    }

    function generateOne() {
      document.getElementById('single-uuid').textContent = uuidv4();
    }

    function generateBatch() {
      const count = Math.min(Math.max(parseInt(document.getElementById('batch-count').value) || 1, 1), 1000);
      const uuids = [];
      for (let i = 0; i < count; i++) uuids.push(uuidv4());
      document.getElementById('batch-output').textContent = uuids.join('\n');
    }

    function copyFrom(id) {
      copyToClipboard(document.getElementById(id).textContent);
    }
  </script>
<script src="../shared.js"></script>
  <script>
    generateOne();
    loadFromHash();
  </script>
<script src="../autosave.js"></script>
</body>
</html>
