<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <title>UUID Generator - Dev Tools</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Chivo+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
  <style>
    .uuid-display {
      font-family: var(--font-mono);
      font-size: 1.3rem;
      background: var(--color-recess);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: 0.75rem 1rem;
      margin-bottom: 1rem;
      user-select: all;
      cursor: pointer;
      word-break: break-all;
    }

    .uuid-display:hover {
      border-color: var(--color-accent);
    }

    .batch-output {
      font-family: var(--font-mono);
      font-size: 0.9rem;
      line-height: 1.8;
      background: var(--color-recess);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: 0.75rem;
      white-space: pre-wrap;
      word-break: break-all;
      min-height: 60px;
      margin-top: 1rem;
      cursor: pointer;
    }

    .batch-output:hover {
      border-color: var(--color-accent);
    }

    .count-input {
      width: 70px;
      text-align: center;
    }

    .rule {
      border: none;
      border-top: 1px solid var(--color-border-soft);
      margin: 1.5rem 0;
    }
  </style>
</head>
<body>
  <header>
    <a class="back-link" href="../index.html"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg> Back</a>
    <a class="site-title" href="../index.html">Dev Tools</a>
    <span class="header-spacer"></span>
    <a class="rail-link" href="https://github.com/gavin-meeker/dev-tools" target="_blank" rel="noopener" title="Source on GitHub" aria-label="Source on GitHub"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg></a>
    <button class="theme-toggle" id="theme-toggle" title="Toggle theme"></button>
  </header>

  <main class="narrow">
    <div class="page-title-bar">
      <h1>UUID generator</h1>
      <span class="page-note">generate version 4 UUIDs, one at a time or in bulk</span>
    </div>
    <div class="tool-container">
      <label>UUID v4</label>
      <div class="output-wrap">
        <div class="uuid-display" id="single-uuid"></div>
        <button class="copy-icon" onclick="copyFrom('single-uuid')" title="Copy"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
      </div>

      <div class="btn-row">
        <button onclick="generateOne()">Generate</button>
      </div>

      <hr class="rule">

      <label>Batch generate</label>
      <div class="btn-row" style="align-items: center;">
        <input type="number" class="count-input" id="batch-count" value="10" min="1" max="1000">
        <button onclick="generateBatch()">Generate batch</button>
      </div>
      <div class="output-wrap">
        <div class="batch-output" id="batch-output"></div>
        <button class="copy-icon" onclick="copyFrom('batch-output')" title="Copy"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
      </div>
    </div>
  </main>
<footer>
    <span>Made by Gavin Meeker</span>
    <span id="share-timestamp"></span>
  </footer>

  <script>
    function uuidv4() {
      return crypto.randomUUID();
    }

    function generateOne() {
      document.getElementById('single-uuid').textContent = uuidv4();
    }

    function generateBatch() {
      const count = Math.min(Math.max(parseInt(document.getElementById('batch-count').value) || 1, 1), 1000);
      const uuids = [];
      for (let i = 0; i < count; i++) uuids.push(uuidv4());
      document.getElementById('batch-output').textContent = uuids.join('\n');
    }

    function copyFrom(id) {
      copyToClipboard(document.getElementById(id).textContent);
    }
  </script>
<script src="../shared.js"></script>
  <script>
    generateOne();
    loadFromHash();
  </script>
<script src="../autosave.js"></script>
</body>
</html>
