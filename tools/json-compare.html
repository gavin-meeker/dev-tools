<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSON Compare - Dev Tools</title>
  <link rel="stylesheet" href="../styles.css">
  <style>
    main {
      max-width: 75%;
    }

    .dual-input {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    @media (max-width: 600px) {
      .dual-input { grid-template-columns: 1fr; }
    }

    .error-msg {
      color: #f85149;
      font-weight: 600;
      margin-top: 0.5rem;
    }

    .match-msg {
      color: #3fb950;
      font-weight: 600;
      margin-top: 0.5rem;
    }

    .diff-view {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      overflow: auto;
      margin-top: 0.5rem;
    }

    .diff-side {
      overflow: auto;
    }

    .diff-side:first-child {
      border-right: 2px solid var(--color-border);
    }

    .diff-side-header {
      font-family: monospace;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 6px 10px;
      background: var(--color-bg);
      border-bottom: 1px solid var(--color-border);
      color: var(--color-text-light);
    }

    .diff-line {
      display: flex;
      white-space: pre;
      line-height: 1.5;
      font-family: monospace;
      font-size: 0.85rem;
      min-height: 1.5em;
    }

    .diff-line-num {
      width: 36px;
      min-width: 36px;
      text-align: right;
      padding: 0 6px 0 4px;
      color: #888;
      user-select: none;
      border-right: 1px solid var(--color-border);
    }

    .diff-line-content {
      padding: 0 8px;
      flex: 1;
    }

    .diff-line.added {
      background: #0f2d1a;
    }
    .diff-line.added .diff-line-num {
      background: #133a1f;
      color: #3fb950;
    }
    .diff-line.added .diff-line-content {
      color: #3fb950;
    }

    .diff-line.removed {
      background: #3d1214;
    }
    .diff-line.removed .diff-line-num {
      background: #4d1519;
      color: #f85149;
    }
    .diff-line.removed .diff-line-content {
      color: #f85149;
    }

    .diff-line.empty {
      background: #1a1e24;
    }
    .diff-line.empty .diff-line-num {
      background: #1a1e24;
    }

    .diff-line.unchanged {
      background: var(--color-surface);
    }
  </style>
</head>
<body>
  <header>
    <a class="site-title" href="../index.html">Dev Tools</a>
    <nav><a href="../index.html">All Tools</a></nav>
  </header>

  <main>
    <h1>JSON Compare</h1>
    <div class="tool-container">
      <div class="dual-input">
        <div>
          <label for="input-left">Left</label>
          <textarea id="input-left" placeholder='{"key": "value"}'></textarea>
        </div>
        <div>
          <label for="input-right">Right</label>
          <textarea id="input-right" placeholder='{"key": "value"}'></textarea>
        </div>
      </div>

      <div class="btn-row">
        <button onclick="compare()">Compare</button>
      </div>

      <div class="output-area" id="output"></div>
    </div>
  </main>
<footer>Made by Gavin Meeker</footer>

  <script>
    function compare() {
      const output = document.getElementById('output');
      let left, right;

      try {
        left = JSON.parse(document.getElementById('input-left').value);
      } catch (e) {
        output.innerHTML = '<p class="error-msg">Left JSON is invalid: ' + escapeHtml(e.message) + '</p>';
        return;
      }

      try {
        right = JSON.parse(document.getElementById('input-right').value);
      } catch (e) {
        output.innerHTML = '<p class="error-msg">Right JSON is invalid: ' + escapeHtml(e.message) + '</p>';
        return;
      }

      const leftLines = JSON.stringify(left, null, 2).split('\n');
      const rightLines = JSON.stringify(right, null, 2).split('\n');
      const diff = myersDiff(leftLines, rightLines);

      if (diff.every(d => d.type === 'unchanged')) {
        output.innerHTML = '<p class="match-msg">The two JSON values are identical.</p>';
        return;
      }

      // Build paired rows for side-by-side display
      const rows = [];
      let i = 0;
      while (i < diff.length) {
        const d = diff[i];
        if (d.type === 'unchanged') {
          rows.push({ left: { type: 'unchanged', value: d.value }, right: { type: 'unchanged', value: d.value } });
          i++;
        } else if (d.type === 'removed') {
          // Collect consecutive removed, then consecutive added, and pair them
          const removed = [];
          while (i < diff.length && diff[i].type === 'removed') {
            removed.push(diff[i].value);
            i++;
          }
          const added = [];
          while (i < diff.length && diff[i].type === 'added') {
            added.push(diff[i].value);
            i++;
          }
          const maxLen = Math.max(removed.length, added.length);
          for (let j = 0; j < maxLen; j++) {
            rows.push({
              left: j < removed.length ? { type: 'removed', value: removed[j] } : { type: 'empty', value: '' },
              right: j < added.length ? { type: 'added', value: added[j] } : { type: 'empty', value: '' },
            });
          }
        } else if (d.type === 'added') {
          rows.push({
            left: { type: 'empty', value: '' },
            right: { type: 'added', value: d.value },
          });
          i++;
        }
      }

      // Render left and right sides
      let leftNum = 0, rightNum = 0;
      let leftHtml = '', rightHtml = '';
      for (const row of rows) {
        // Left side
        if (row.left.type === 'unchanged' || row.left.type === 'removed') leftNum++;
        const lNum = row.left.type === 'empty' ? '' : leftNum;
        leftHtml += renderLine(row.left.type, lNum, row.left.value);

        // Right side
        if (row.right.type === 'unchanged' || row.right.type === 'added') rightNum++;
        const rNum = row.right.type === 'empty' ? '' : rightNum;
        rightHtml += renderLine(row.right.type, rNum, row.right.value);
      }

      const added = diff.filter(d => d.type === 'added').length;
      const removed = diff.filter(d => d.type === 'removed').length;
      const summary = '<p style="margin-bottom:0.5rem"><strong>'
        + '<span style="color:#3fb950">+' + added + '</span> '
        + '<span style="color:#f85149">-' + removed + '</span>'
        + '</strong></p>';

      output.innerHTML = summary
        + '<div class="diff-view">'
        + '<div class="diff-side"><div class="diff-side-header">Left</div>' + leftHtml + '</div>'
        + '<div class="diff-side"><div class="diff-side-header">Right</div>' + rightHtml + '</div>'
        + '</div>';

      // Sync scrolling between the two sides
      const sides = output.querySelectorAll('.diff-side');
      let syncing = false;
      sides.forEach((side, idx) => {
        side.addEventListener('scroll', () => {
          if (syncing) return;
          syncing = true;
          const other = sides[idx === 0 ? 1 : 0];
          other.scrollTop = side.scrollTop;
          other.scrollLeft = side.scrollLeft;
          syncing = false;
        });
      });
    }

    function renderLine(type, num, value) {
      return '<div class="diff-line ' + type + '">'
        + '<span class="diff-line-num">' + num + '</span>'
        + '<span class="diff-line-content">' + escapeHtml(value) + '</span>'
        + '</div>';
    }

    function myersDiff(left, right) {
      const N = left.length;
      const M = right.length;
      const MAX = N + M;
      const v = new Array(2 * MAX + 1);
      v[MAX + 1] = 0;
      const trace = [];

      for (let d = 0; d <= MAX; d++) {
        const newV = v.slice();
        for (let k = -d; k <= d; k += 2) {
          let x;
          if (k === -d || (k !== d && v[MAX + k - 1] < v[MAX + k + 1])) {
            x = v[MAX + k + 1];
          } else {
            x = v[MAX + k - 1] + 1;
          }
          let y = x - k;
          while (x < N && y < M && left[x] === right[y]) {
            x++;
            y++;
          }
          newV[MAX + k] = x;
          if (x >= N && y >= M) {
            trace.push(newV);
            return backtrack(trace, MAX, left, right);
          }
        }
        trace.push(newV.slice());
        for (let k = -d; k <= d; k += 2) {
          v[MAX + k] = newV[MAX + k];
        }
      }
      return [];
    }

    function backtrack(trace, MAX, left, right) {
      let x = left.length;
      let y = right.length;
      const result = [];

      for (let d = trace.length - 1; d >= 0; d--) {
        const v = trace[d];
        const k = x - y;
        let prevK;
        if (k === -d || (k !== d && (d === 0 ? -1 : trace[d-1][MAX + k - 1]) < (d === 0 ? -1 : trace[d-1][MAX + k + 1]))) {
          prevK = k + 1;
        } else {
          prevK = k - 1;
        }

        const prevX = d === 0 ? 0 : trace[d - 1][MAX + prevK];
        const prevY = prevX - prevK;

        while (x > prevX && y > prevY) {
          x--;
          y--;
          result.push({ type: 'unchanged', value: left[x] });
        }

        if (d > 0) {
          if (x === prevX) {
            result.push({ type: 'added', value: right[y - 1] });
            y--;
          } else {
            result.push({ type: 'removed', value: left[x - 1] });
            x--;
          }
        }
      }

      return result.reverse();
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }
  </script>
</body>
</html>
