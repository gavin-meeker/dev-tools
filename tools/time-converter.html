<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <title>Time Converter - Dev Tools</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Chivo+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
  <style>
    .tz-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(13rem, 1fr));
      gap: 0.7rem;
      margin-bottom: 1.6rem;
    }

    .tz-card {
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: 0.8rem 0.9rem;
      background: var(--color-surface);
    }

    .tz-card h3 {
      font-family: var(--font-mono);
      font-weight: 400;
      font-size: 0.73rem;
      color: var(--color-text-light);
      margin-bottom: 0.45rem;
    }

    .tz-card .time-display {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      font-size: 1.4rem;
      font-weight: 500;
      line-height: 1.15;
      margin-bottom: 0.2rem;
    }

    .tz-card .date-display {
      font-size: 0.8rem;
      color: var(--color-text-light);
    }

    .input-row {
      display: flex;
      gap: 0.9rem;
      flex-wrap: wrap;
      align-items: end;
      margin-bottom: 1.4rem;
    }

    .input-row > div {
      display: flex;
      flex-direction: column;
    }

    .time-input {
      font-family: var(--font-mono);
      width: 110px;
    }
  </style>
</head>
<body>
  <header>
    <a class="back-link" href="../index.html"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg> Back</a>
    <a class="site-title" href="../index.html">Dev Tools</a>
    <span class="header-spacer"></span>
    <a class="rail-link" href="https://github.com/gavin-meeker/dev-tools" target="_blank" rel="noopener" title="Source on GitHub" aria-label="Source on GitHub"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg></a>
    <button class="theme-toggle" id="theme-toggle" title="Toggle theme"></button>
  </header>

  <main class="wide">
    <div class="page-title-bar">
      <h1>Time converter</h1>
      <span class="page-note">convert a date and time across timezones and unix formats</span>
    </div>
    <div class="tool-container">
      <div class="input-row">
        <div>
          <label for="date-input">Date</label>
          <input type="date" id="date-input">
        </div>
        <div>
          <label for="time-input">Time (24h)</label>
          <input type="text" id="time-input" class="time-input" placeholder="16:30:00">
        </div>
        <div>
          <label for="tz-input">Timezone</label>
          <select id="tz-input">
            <option value="UTC">UTC</option>
            <option value="America/New_York" selected>US Eastern</option>
            <option value="America/Chicago">US Central</option>
            <option value="America/Denver">US Mountain</option>
            <option value="America/Los_Angeles">US Pacific</option>
            <option value="Europe/London">London</option>
            <option value="Europe/Paris">Paris / Berlin</option>
            <option value="Asia/Tokyo">Tokyo</option>
            <option value="Asia/Shanghai">Shanghai</option>
            <option value="Asia/Kolkata">India (IST)</option>
            <option value="Australia/Sydney">Sydney</option>
          </select>
        </div>
        <div>
          <label>&nbsp;</label>
          <button onclick="setNow()">Now</button>
        </div>
      </div>

      <div class="tz-grid" id="tz-grid"></div>

      <label>Unix timestamp</label>
      <div class="readout tight">
        <div class="cell"><span class="n" id="unix-seconds">-</span><span class="l">seconds</span></div>
        <div class="cell"><span class="n" id="unix-ms">-</span><span class="l">milliseconds</span></div>
      </div>
    </div>
  </main>
<footer>
    <span>Made by Gavin Meeker</span>
    <span id="share-timestamp"></span>
  </footer>

  <script>
    const zones = [
      { label: 'UTC', tz: 'UTC' },
      { label: 'US Eastern (ET)', tz: 'America/New_York' },
      { label: 'US Central (CT)', tz: 'America/Chicago' },
      { label: 'US Mountain (MT)', tz: 'America/Denver' },
      { label: 'US Pacific (PT)', tz: 'America/Los_Angeles' },
      { label: 'London (GMT/BST)', tz: 'Europe/London' },
      { label: 'Paris / Berlin (CET)', tz: 'Europe/Paris' },
      { label: 'Tokyo (JST)', tz: 'Asia/Tokyo' },
      { label: 'Shanghai (CST)', tz: 'Asia/Shanghai' },
      { label: 'India (IST)', tz: 'Asia/Kolkata' },
      { label: 'Sydney (AEST)', tz: 'Australia/Sydney' },
    ];

    const dateInput = document.getElementById('date-input');
    const timeInput = document.getElementById('time-input');
    const tzInput = document.getElementById('tz-input');

    dateInput.addEventListener('input', convert);
    timeInput.addEventListener('input', convert);
    tzInput.addEventListener('change', convert);

    function setNow() {
      const now = new Date();
      const tz = tzInput.value;
      const local = toLocalString(now, tz);
      const [datePart, timePart] = local.split('T');
      dateInput.value = datePart;
      timeInput.value = timePart;
      convert();
    }

    function toLocalString(date, tz) {
      const parts = {};
      new Intl.DateTimeFormat('en-CA', {
        timeZone: tz,
        year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit', second: '2-digit',
        hour12: false,
      }).formatToParts(date).forEach(p => { parts[p.type] = p.value; });
      return parts.year + '-' + parts.month + '-' + parts.day
        + 'T' + parts.hour + ':' + parts.minute + ':' + parts.second;
    }

    function parseInputAsDate() {
      const dateVal = dateInput.value;
      const timeVal = timeInput.value;
      if (!dateVal || !timeVal) return null;

      // Validate time format (HH:MM or HH:MM:SS)
      const timeMatch = timeVal.match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?$/);
      if (!timeMatch) return null;
      const h = timeMatch[1].padStart(2, '0');
      const m = timeMatch[2];
      const s = timeMatch[3] || '00';
      const val = dateVal + 'T' + h + ':' + m + ':' + s;

      const tz = tzInput.value;
      const naive = new Date(val + 'Z');
      if (isNaN(naive.getTime())) return null;
      const offset = getOffsetMs(naive, tz);
      const adjusted = new Date(naive.getTime() - offset);
      // Refine in case DST boundary shifted the offset
      const offset2 = getOffsetMs(adjusted, tz);
      return new Date(naive.getTime() - offset2);
    }

    function getOffsetMs(date, tz) {
      const utcStr = toLocalString(date, 'UTC');
      const tzStr = toLocalString(date, tz);
      const utcDate = new Date(utcStr + 'Z');
      const tzDate = new Date(tzStr + 'Z');
      return tzDate.getTime() - utcDate.getTime();
    }

    function convert() {
      const date = parseInputAsDate();
      const grid = document.getElementById('tz-grid');
      const unixS = document.getElementById('unix-seconds');
      const unixMs = document.getElementById('unix-ms');

      if (!date || isNaN(date.getTime())) {
        grid.innerHTML = '';
        unixS.textContent = '-';
        unixMs.textContent = '-';
        return;
      }

      unixS.textContent = Math.floor(date.getTime() / 1000);
      unixMs.textContent = date.getTime();

      grid.innerHTML = zones.map(z => {
        const timeFmt = new Intl.DateTimeFormat('en-GB', {
          timeZone: z.tz,
          hour: '2-digit', minute: '2-digit', second: '2-digit',
          hour12: false,
        }).format(date);

        const dateFmt = new Intl.DateTimeFormat('en-US', {
          timeZone: z.tz,
          weekday: 'short', year: 'numeric', month: 'short', day: 'numeric',
        }).format(date);

        const abbr = new Intl.DateTimeFormat('en-US', {
          timeZone: z.tz,
          timeZoneName: 'short',
        }).formatToParts(date).find(p => p.type === 'timeZoneName')?.value || '';

        return '<div class="tz-card">'
          + '<h3>' + z.label + ' (' + abbr + ')</h3>'
          + '<div class="time-display">' + timeFmt + '</div>'
          + '<div class="date-display">' + dateFmt + '</div>'
          + '</div>';
      }).join('');
    }

    // Initialize with current time
  </script>
<script src="../shared.js"></script>
  <script>
    if (!loadFromHash()) setNow();
  </script>
<script src="../autosave.js"></script>
</body>
</html>
