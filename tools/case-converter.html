<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <title>Case Converter - Dev Tools</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <header>
    <a class="back-link" href="../index.html"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg> Back</a>
    <a class="site-title" href="../index.html">Dev Tools</a>
    <span class="header-spacer"></span>
    <button class="theme-toggle" id="theme-toggle" title="Toggle theme"></button>
  </header>

  <main>
    <div class="page-title-bar">
      <h1>Case Converter</h1>
      <button class="btn-clear" onclick="saveToHash()"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg> Share</button>
    </div>
    <div class="tool-container">
      <label for="input">Input</label>
      <div class="input-wrap">
        <textarea id="input" placeholder="Paste your text here..."></textarea>
        <button class="clear-icon" onclick="clearTool()" title="Clear"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>

      <div class="btn-row">
        <button onclick="convert(t => t.toUpperCase())">UPPERCASE</button>
        <button onclick="convert(t => t.toLowerCase())">lowercase</button>
        <button onclick="convert(toTitleCase)">Title Case</button>
        <button onclick="convert(toSentenceCase)">Sentence case</button>
      </div>

      <div class="output-area">
        <label for="output">Output</label>
        <div class="output-wrap">
          <pre id="output"></pre>
          <button class="copy-icon" onclick="copyOutput()" title="Copy"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
        </div>
      </div>
    </div>
  </main>
<footer>Made by Gavin Meeker</footer>

  <script>
    function convert(fn) {
      const input = document.getElementById('input').value;
      document.getElementById('output').textContent = fn(input);
    }

    function toTitleCase(str) {
      return str.replace(/\w\S*/g, word =>
        word.charAt(0).toUpperCase() + word.slice(1).toLowerCase()
      );
    }

    function toSentenceCase(str) {
      return str.toLowerCase().replace(/(^\s*|[.!?]\s+)(\w)/g, (match, sep, char) =>
        sep + char.toUpperCase()
      );
    }

    function copyOutput() {
      copyToClipboard(document.getElementById('output').textContent);
    }
  </script>
<script src="../shared.js"></script>
  <script>
    loadFromHash();
  </script>
<script src="../autosave.js"></script>
</body>
</html>
