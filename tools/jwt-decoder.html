<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <title>JWT Decoder - Dev Tools</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Chivo+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
  <style>
    .jwt-parts {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 0.9rem;
      margin-top: 1rem;
    }

    @media (max-width: 700px) {
      .jwt-parts { grid-template-columns: 1fr; }
    }

    .jwt-part {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border-left-width: 2px;
    }

    .jwt-part-header {
      font-family: var(--font-mono);
      font-weight: 400;
      font-size: 0.73rem;
      padding: 0.4rem 0.75rem;
      border-bottom: 1px solid var(--color-border);
      color: var(--color-text-light);
    }

    .jwt-part pre {
      padding: 0.7rem 0.8rem;
      margin: 0;
      font-size: 0.82rem;
      line-height: 1.7;
      white-space: pre-wrap;
      word-wrap: break-word;
      background: var(--color-recess);
      min-height: 80px;
      flex: 1;
      font-family: var(--font-mono);
      color: var(--color-text);
    }

    .part-header { border-left-color: var(--color-jwt-header-text); }
    .part-header .jwt-part-header { color: var(--color-jwt-header-text); }
    .part-payload { border-left-color: var(--color-jwt-payload-text); }
    .part-payload .jwt-part-header { color: var(--color-jwt-payload-text); }
    .part-signature { border-left-color: var(--color-jwt-signature-text); }
    .part-signature .jwt-part-header { color: var(--color-jwt-signature-text); }

    .jwt-input { word-break: break-all; }

    .exp-info {
      margin-top: 1rem;
      padding: 0.4rem 0.7rem;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      border-left: 2px solid transparent;
    }

    .exp-valid { background: var(--color-success-bg); color: var(--color-success); border-left-color: var(--color-success); }
    .exp-expired { background: var(--color-error-bg); color: var(--color-error); border-left-color: var(--color-error); }
  </style>
</head>
<body>
  <header>
    <a class="back-link" href="../index.html"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg> Back</a>
    <a class="site-title" href="../index.html">Dev Tools</a>
    <span class="header-spacer"></span>
    <a class="rail-link" href="https://github.com/gavin-meeker/dev-tools" target="_blank" rel="noopener" title="Source on GitHub" aria-label="Source on GitHub"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg></a>
    <button class="theme-toggle" id="theme-toggle" title="Toggle theme"></button>
  </header>

  <main>
    <div class="page-title-bar">
      <h1>JWT decoder</h1>
      <span class="page-note">decode a JSON Web Token's header, payload and signature</span>
    </div>
    <div class="tool-container">
      <label for="input">Paste JWT</label>
      <div class="input-wrap">
        <textarea id="input" class="jwt-input" placeholder="eyJhbGciOiJIUzI1NiIs..." oninput="decode()"></textarea>
        <button class="clear-icon" onclick="clearTool()" title="Clear"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>

      <div id="error"></div>
      <div id="expiry"></div>
      <div class="jwt-parts" id="parts" style="display:none;">
        <div class="jwt-part">
          <div class="jwt-part-header part-header">Header</div>
          <pre id="jwt-header"></pre>
        </div>
        <div class="jwt-part">
          <div class="jwt-part-header part-payload">Payload</div>
          <pre id="jwt-payload"></pre>
        </div>
        <div class="jwt-part">
          <div class="jwt-part-header part-signature">Signature</div>
          <pre id="jwt-signature"></pre>
        </div>
      </div>
    </div>
  </main>
<footer>
    <span>Made by Gavin Meeker</span>
    <span id="share-timestamp"></span>
  </footer>

  <script>
    function decode() {
      const input = document.getElementById('input').value.trim();
      const errorEl = document.getElementById('error');
      const partsEl = document.getElementById('parts');
      const expiryEl = document.getElementById('expiry');

      errorEl.innerHTML = '';
      expiryEl.innerHTML = '';

      if (!input) {
        partsEl.style.display = 'none';
        return;
      }

      const segments = input.split('.');
      if (segments.length !== 3) {
        partsEl.style.display = 'none';
        errorEl.innerHTML = '<p class="error-msg">Invalid JWT: expected 3 dot-separated parts, got ' + segments.length + '.</p>';
        return;
      }

      let header, payload;
      try {
        header = JSON.parse(b64Decode(segments[0]));
      } catch (e) {
        partsEl.style.display = 'none';
        errorEl.innerHTML = '<p class="error-msg">Failed to decode header: ' + escapeHtml(e.message) + '</p>';
        return;
      }

      try {
        payload = JSON.parse(b64Decode(segments[1]));
      } catch (e) {
        partsEl.style.display = 'none';
        errorEl.innerHTML = '<p class="error-msg">Failed to decode payload: ' + escapeHtml(e.message) + '</p>';
        return;
      }

      document.getElementById('jwt-header').innerHTML = highlightJson(header);
      document.getElementById('jwt-payload').innerHTML = highlightJson(payload);
      document.getElementById('jwt-signature').textContent = segments[2];
      partsEl.style.display = '';

      // Show expiry info
      if (payload.exp) {
        const expDate = new Date(payload.exp * 1000);
        const now = new Date();
        const expired = expDate < now;
        const cls = expired ? 'exp-expired' : 'exp-valid';
        const label = expired ? 'Expired' : 'Valid';
        expiryEl.innerHTML = '<div class="exp-info ' + cls + '">'
          + '<strong>' + label + '</strong> — expires ' + escapeHtml(expDate.toLocaleString())
          + (payload.iat ? ' (issued ' + escapeHtml(new Date(payload.iat * 1000).toLocaleString()) + ')' : '')
          + '</div>';
      }
    }

    function b64Decode(str) {
      // Handle base64url encoding
      let b64 = str.replace(/-/g, '+').replace(/_/g, '/');
      while (b64.length % 4) b64 += '=';
      return decodeURIComponent(atob(b64).split('').map(c =>
        '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)
      ).join(''));
    }

    function highlightJson(obj) {
      const json = JSON.stringify(obj, null, 2);
      return json.replace(/("(?:\\.|[^"\\])*")\s*:/g, '<span class="json-key">$1</span>:')
        .replace(/:\s*("(?:\\.|[^"\\])*")/g, function(match, str) {
          return match.replace(str, '<span class="json-string">' + str + '</span>');
        })
        .replace(/:\s*(-?\d+\.?\d*(?:[eE][+-]?\d+)?)/g, function(match, num) {
          return match.replace(num, '<span class="json-number">' + num + '</span>');
        })
        .replace(/:\s*(true|false)/g, function(match, bool) {
          return match.replace(bool, '<span class="json-bool">' + bool + '</span>');
        })
        .replace(/:\s*(null)/g, function(match, n) {
          return match.replace(n, '<span class="json-null">' + n + '</span>');
        });
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }
  </script>
<script src="../shared.js"></script>
</body>
</html>
