<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <title>Markdown Preview - Dev Tools</title>
  <link rel="stylesheet" href="../styles.css">
  <style>
    main {
      max-width: 95%;
    }

    .view-tabs {
      display: inline-flex;
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 0.25rem;
    }

    .view-tabs button {
      background: transparent;
      border: none;
      padding: 0.5rem 1rem;
      color: var(--color-text-light);
      cursor: pointer;
      font-size: 0.9rem;
      border-right: 1px solid var(--color-border);
      transition: background 0.15s ease, color 0.15s ease;
    }

    .view-tabs button:last-child { border-right: none; }

    .view-tabs button:hover {
      color: var(--color-text);
    }

    .view-tabs button.active {
      background: var(--color-accent);
      color: #fff;
    }

    .share-timestamp {
      font-size: 0.85rem;
      color: var(--color-text-light);
      white-space: nowrap;
    }

    @media (max-width: 700px) {
      .share-timestamp { display: none; }
    }

    .split-view {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-top: 1rem;
    }

    /* Prevent long unbreakable content (URLs, hashes) from forcing a grid track wider than 1fr */
    .split-view > * { min-width: 0; }

    .split-view.mode-preview,
    .split-view.mode-text {
      grid-template-columns: 1fr;
    }

    .split-view.mode-preview .pane-input,
    .split-view.mode-text .pane-preview {
      display: none;
    }

    @media (max-width: 700px) {
      .split-view.mode-compare { grid-template-columns: 1fr; }
      .view-tabs button { padding: 0.5rem 0.75rem; font-size: 0.85rem; }
    }

    .split-view textarea {
      min-height: 400px;
      margin-bottom: 0;
      overflow: hidden;
      resize: none;
    }

    .split-view.mode-text textarea {
      min-height: 60vh;
      font-size: 1rem;
    }

    .split-view.mode-preview .preview-pane,
    .split-view.mode-text textarea {
      max-width: 100%;
    }

    .preview-pane {
      background: var(--color-bg);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: 1rem 1.25rem;
      min-height: 400px;
      overflow: auto;
      font-size: 0.95rem;
      line-height: 1.7;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    /* Let <pre> code blocks scroll horizontally instead of breaking mid-token */
    .preview-pane pre,
    .preview-pane pre code {
      overflow-wrap: normal;
      word-break: normal;
    }

    /* Markdown rendered styles */
    .preview-pane h1,
    .preview-pane h2,
    .preview-pane h3,
    .preview-pane h4,
    .preview-pane h5,
    .preview-pane h6 {
      margin-top: 1.2em;
      margin-bottom: 0.5em;
      line-height: 1.3;
    }

    .preview-pane h1 { font-size: 1.8rem; border-bottom: 1px solid var(--color-border); padding-bottom: 0.3em; }
    .preview-pane h2 { font-size: 1.4rem; border-bottom: 1px solid var(--color-border); padding-bottom: 0.3em; }
    .preview-pane h3 { font-size: 1.15rem; }

    .preview-pane p {
      margin: 0.8em 0;
    }

    .preview-pane a {
      color: var(--color-accent);
    }

    .preview-pane code {
      background: var(--color-code-bg);
      padding: 0.15em 0.4em;
      border-radius: 4px;
      font-size: 0.9em;
      color: var(--color-code-inline);
    }

    .preview-pane pre {
      background: var(--color-code-bg);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: 0.75rem;
      overflow-x: auto;
      margin: 0.8em 0;
    }

    .preview-pane pre code {
      background: none;
      padding: 0;
      color: var(--color-text);
    }

    .preview-pane blockquote {
      border-left: 3px solid var(--color-accent);
      padding-left: 1rem;
      margin: 0.8em 0;
      color: var(--color-text-light);
    }

    .preview-pane ul,
    .preview-pane ol {
      margin: 0.8em 0;
      padding-left: 1.5rem;
    }

    .preview-pane li {
      margin: 0.25em 0;
    }

    .preview-pane hr {
      border: none;
      border-top: 1px solid var(--color-border);
      margin: 1.5em 0;
    }

    .preview-pane img {
      max-width: 100%;
    }

    .preview-pane table {
      border-collapse: collapse;
      width: 100%;
      margin: 0.8em 0;
    }

    .preview-pane th,
    .preview-pane td {
      border: 1px solid var(--color-border);
      padding: 0.4rem 0.75rem;
      text-align: left;
    }

    .preview-pane th {
      background: var(--color-code-bg);
    }
  </style>
</head>
<body>
  <header>
    <a class="back-link" href="../index.html"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg> Back</a>
    <a class="site-title" href="../index.html">Dev Tools</a>
    <span class="header-spacer"></span>
    <button class="theme-toggle" id="theme-toggle" title="Toggle theme"></button>
  </header>

  <main>
    <div class="page-title-bar">
      <h1>Markdown Preview</h1>
      <div style="display: flex; gap: 0.75rem; align-items: center;">
        <span id="share-timestamp" class="share-timestamp"></span>
        <button class="btn-clear" onclick="saveToHash()"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg> Share</button>
      </div>
    </div>
    <div class="tool-container">
      <div class="view-tabs" role="tablist" aria-label="View mode">
        <button type="button" data-view="compare" onclick="setView('compare')">Compare</button>
        <button type="button" data-view="preview" onclick="setView('preview')">Preview</button>
        <button type="button" data-view="text" onclick="setView('text')">Text</button>
      </div>
      <div class="split-view mode-compare" id="split-view">
        <div class="pane-input">
          <label for="input">Markdown</label>
          <div class="input-wrap">
            <textarea id="input" oninput="render()" placeholder="# Hello World

Write some **markdown** here..."></textarea>
            <button class="clear-icon" onclick="clearTool()" title="Clear"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
          </div>
        </div>
        <div class="pane-preview">
          <label>Preview</label>
          <div class="preview-pane" id="preview"></div>
        </div>
      </div>
    </div>
  </main>
  <footer>Made by Gavin Meeker</footer>

  <script>
    var VIEW_STORAGE_KEY = 'devtools:markdown-view';

    function setView(mode) {
      var sv = document.getElementById('split-view');
      sv.classList.remove('mode-compare', 'mode-preview', 'mode-text');
      sv.classList.add('mode-' + mode);
      document.querySelectorAll('.view-tabs button').forEach(function(b) {
        b.classList.toggle('active', b.dataset.view === mode);
      });
      try { localStorage.setItem(VIEW_STORAGE_KEY, mode); } catch (e) {}
      if (mode !== 'preview') autoResize();
    }

    function render() {
      const md = document.getElementById('input').value;
      document.getElementById('preview').innerHTML = parseMarkdown(md);
      autoResize();
    }

    function autoResize() {
      const ta = document.getElementById('input');
      ta.style.height = 'auto';
      ta.style.height = ta.scrollHeight + 'px';
    }

    function buildNestedList(block, tag, bulletRe) {
      var lines = block.split('\n');
      var result = '';
      var stack = [];
      for (var i = 0; i < lines.length; i++) {
        var m = lines[i].match(bulletRe);
        if (!m) continue;
        var indent = m[1].length;
        var content = m[3];
        if (stack.length === 0) {
          result += '<' + tag + '><li>' + content;
          stack.push(indent);
        } else if (indent > stack[stack.length - 1]) {
          result += '<' + tag + '><li>' + content;
          stack.push(indent);
        } else {
          while (stack.length > 1 && indent < stack[stack.length - 1]) {
            stack.pop();
            result += '</li></' + tag + '>';
          }
          result += '</li><li>' + content;
        }
      }
      while (stack.length > 0) {
        stack.pop();
        result += '</li></' + tag + '>';
      }
      return result;
    }

    function parseMarkdown(md) {
      // Escape HTML
      let html = md
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');

      // Fenced code blocks — stash as placeholders so later passes don't touch their contents
      var codeBlocks = [];
      html = html.replace(/```(\w*)\n([\s\S]*?)```/g, function(_, lang, code) {
        codeBlocks.push('<pre><code>' + code.trimEnd() + '</code></pre>');
        return '%%CB' + (codeBlocks.length - 1) + '%%';
      });

      // Preserve extra blank lines as visible spacing (3+ newlines => extra <br>s)
      html = html.replace(/\n{3,}/g, function(m) {
        return '\n\n' + '<br>'.repeat(m.length - 2) + '\n\n';
      });

      // Inline code (must come after fenced blocks)
      html = html.replace(/`([^`\n]+)`/g, '<code>$1</code>');

      // Headings
      html = html.replace(/^######\s+(.+)$/gm, '<h6>$1</h6>');
      html = html.replace(/^#####\s+(.+)$/gm, '<h5>$1</h5>');
      html = html.replace(/^####\s+(.+)$/gm, '<h4>$1</h4>');
      html = html.replace(/^###\s+(.+)$/gm, '<h3>$1</h3>');
      html = html.replace(/^##\s+(.+)$/gm, '<h2>$1</h2>');
      html = html.replace(/^#\s+(.+)$/gm, '<h1>$1</h1>');

      // Horizontal rules
      html = html.replace(/^(?:---|\*\*\*|___)$/gm, '<hr>');

      // Blockquotes
      html = html.replace(/^(?:&gt;)\s?(.+)$/gm, '<blockquote>$1</blockquote>');
      // Merge adjacent blockquotes
      html = html.replace(/<\/blockquote>\n<blockquote>/g, '\n');

      // Tables
      html = html.replace(/^(\|.+\|)\n(\|[\s:|-]+\|)\n((?:\|.+\|\n?)+)/gm, function(_, headerRow, sepRow, bodyRows) {
        const headers = headerRow.split('|').filter(c => c.trim()).map(c => '<th>' + c.trim() + '</th>').join('');
        const rows = bodyRows.trim().split('\n').map(row => {
          const cells = row.split('|').filter(c => c.trim()).map(c => '<td>' + c.trim() + '</td>').join('');
          return '<tr>' + cells + '</tr>';
        }).join('');
        return '<table><thead><tr>' + headers + '</tr></thead><tbody>' + rows + '</tbody></table>';
      });

      // Images (before links)
      html = html.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1">');

      // Links
      html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');

      // Bold + italic
      html = html.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
      html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
      html = html.replace(/___(.+?)___/g, '<strong><em>$1</em></strong>');
      html = html.replace(/(?<!\w)__(.+?)__(?!\w)/g, '<strong>$1</strong>');
      html = html.replace(/(?<!\w)_(.+?)_(?!\w)/g, '<em>$1</em>');

      // Strikethrough
      html = html.replace(/~~(.+?)~~/g, '<del>$1</del>');

      // Unordered lists
      html = html.replace(/^(?:[ ]*[-*+]\s+.+\n?)+/gm, function(block) {
        return buildNestedList(block.trim(), 'ul', /^(\s*)([-*+])\s+(.+)/);
      });

      // Ordered lists
      html = html.replace(/^(?:[ ]*\d+\.\s+.+\n?)+/gm, function(block) {
        return buildNestedList(block.trim(), 'ol', /^(\s*)(\d+\.)\s+(.+)/);
      });

      // Paragraphs: wrap remaining loose text
      html = html.replace(/^(?!<[a-z/])((?:.+\n?)+)/gm, function(block) {
        const trimmed = block.trim();
        if (!trimmed) return '';
        return '<p>' + trimmed.replace(/\n/g, '<br>') + '</p>';
      });

      // Clean up extra newlines
      html = html.replace(/\n{2,}/g, '\n');

      // Restore fenced code blocks (unwrap if paragraph pass wrapped the placeholder)
      html = html.replace(/<p>%%CB(\d+)%%<\/p>/g, function(_, i) { return codeBlocks[+i]; });
      html = html.replace(/%%CB(\d+)%%/g, function(_, i) { return codeBlocks[+i]; });

      return html.trim();
    }

    // Initialize with sample content
    document.getElementById('input').value = `# Markdown Preview

## Features

This is a **live** markdown previewer. It supports:

- **Bold** and *italic* text
- ~~Strikethrough~~
- [Links](https://example.com)
- Inline \`code\` spans

### Code Blocks

\`\`\`js
function greet(name) {
  return "Hello, " + name;
}
\`\`\`

### Blockquotes

> This is a blockquote.
> It can span multiple lines.

### Tables

| Feature | Supported |
|---------|-----------|
| Headings | Yes |
| Lists | Yes |
| Tables | Yes |

---

*Rendered entirely client-side with vanilla JS.*`;
  </script>
<script src="../shared.js"></script>
  <script>
    (function initView() {
      var saved = null;
      try { saved = localStorage.getItem(VIEW_STORAGE_KEY); } catch (e) {}
      var defaultView = window.innerWidth <= 700 ? 'preview' : 'compare';
      setView(saved || defaultView);
    })();
    render();
    if (loadFromHash()) render();
  </script>
<script src="../autosave.js"></script>
</body>
</html>
