<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <title>Markdown Preview - Dev Tools</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Chivo+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
  <style>
    .view-tabs {
      display: inline-flex;
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      overflow: hidden;
      margin-bottom: 0.9rem;
    }

    .view-tabs button {
      background: transparent;
      border: none;
      border-radius: 0;
      padding: 0.4rem 1rem;
      color: var(--color-text-light);
      cursor: pointer;
      font-family: var(--font-mono);
      font-size: 0.78rem;
      border-right: 1px solid var(--color-border);
      transition: background 0.15s ease, color 0.15s ease;
    }

    .view-tabs button:last-child { border-right: none; }

    .view-tabs button:hover {
      color: var(--color-text);
      background: var(--color-surface);
    }

    .view-tabs button.active {
      background: var(--color-accent);
      color: var(--color-accent-ink);
    }

    .split-view {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.4rem;
      margin-top: 1rem;
    }

    /* Prevent long unbreakable content (URLs, hashes) from forcing a grid track wider than 1fr */
    .split-view > * { min-width: 0; }

    /* Divider between editor and preview reads as a hairline, not a boxed panel */
    .split-view.mode-compare .pane-input {
      border-right: 1px solid var(--color-border-soft);
      padding-right: 1.4rem;
    }

    .split-view.mode-preview,
    .split-view.mode-text {
      grid-template-columns: 1fr;
    }

    .split-view.mode-preview .pane-input,
    .split-view.mode-text .pane-preview {
      display: none;
    }

    @media (max-width: 700px) {
      .split-view.mode-compare { grid-template-columns: 1fr; }
      .split-view.mode-compare .pane-input { border-right: 0; border-bottom: 1px solid var(--color-border-soft); padding-right: 0; padding-bottom: 1.4rem; }
      .view-tabs button { padding: 0.5rem 0.75rem; font-size: 0.85rem; }
    }

    .split-view textarea {
      min-height: 400px;
      margin-bottom: 0;
      overflow: hidden;
      resize: none;
    }

    .split-view.mode-text textarea {
      min-height: 60vh;
      font-size: 1rem;
    }

    .split-view.mode-preview .preview-pane,
    .split-view.mode-text textarea {
      max-width: 100%;
    }

    .preview-pane {
      background: var(--color-recess);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: 1.1rem 1.4rem;
      min-height: 400px;
      overflow: auto;
      font-size: 0.92rem;
      line-height: 1.7;
      overflow-wrap: anywhere;
      word-break: break-word;
      color: var(--color-text);
    }

    /* Let <pre> code blocks scroll horizontally instead of breaking mid-token */
    .preview-pane pre,
    .preview-pane pre code {
      overflow-wrap: normal;
      word-break: normal;
    }

    /* Readable prose measure — headings, paragraphs and lists stay narrow even
       though the pane itself fills the column; tables/code/mermaid go full width */
    .preview-pane h1,
    .preview-pane h2,
    .preview-pane h3,
    .preview-pane h4,
    .preview-pane h5,
    .preview-pane h6,
    .preview-pane p,
    .preview-pane ul,
    .preview-pane ol,
    .preview-pane blockquote {
      max-width: 70ch;
    }

    .preview-pane h1,
    .preview-pane h2,
    .preview-pane h3,
    .preview-pane h4,
    .preview-pane h5,
    .preview-pane h6 {
      margin-top: 1.3em;
      margin-bottom: 0.5em;
      line-height: 1.3;
      font-weight: 600;
      letter-spacing: -0.015em;
    }

    .preview-pane h1 { font-size: 1.7rem; border-bottom: 1px solid var(--color-border); padding-bottom: 0.35em; }
    .preview-pane h2 { font-size: 1.3rem; border-bottom: 1px solid var(--color-border); padding-bottom: 0.3em; }
    .preview-pane h3 { font-size: 1.08rem; }
    .preview-pane h4,
    .preview-pane h5,
    .preview-pane h6 { font-size: 0.95rem; color: var(--color-text-light); }

    .preview-pane p {
      margin: 0.8em 0;
    }

    .preview-pane a {
      color: var(--color-accent);
    }

    .preview-pane code {
      background: var(--color-code-bg);
      padding: 0.15em 0.4em;
      border-radius: var(--radius-sm);
      font-family: var(--font-mono);
      font-size: 0.85em;
      color: var(--color-code-inline);
    }

    .preview-pane pre {
      background: var(--color-code-bg);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: 0.8rem 0.9rem;
      overflow-x: auto;
      margin: 0.8em 0;
    }

    .preview-pane pre code {
      background: none;
      padding: 0;
      font-family: var(--font-mono);
      font-size: 0.82rem;
      color: var(--color-text);
    }

    .preview-pane blockquote {
      border-left: 2px solid var(--color-accent);
      padding-left: 1rem;
      margin: 0.8em 0;
      color: var(--color-text-light);
    }

    .preview-pane ul,
    .preview-pane ol {
      margin: 0.8em 0;
      padding-left: 1.5rem;
    }

    .preview-pane li {
      margin: 0.25em 0;
    }

    .preview-pane hr {
      border: none;
      border-top: 1px solid var(--color-border);
      margin: 1.5em 0;
    }

    .preview-pane img {
      max-width: 100%;
      border-radius: var(--radius-sm);
    }

    /* Tables ignore the prose measure and fill the pane; wide ones scroll
       horizontally in their wrapper rather than crushing every column */
    .preview-pane .table-scroll {
      overflow-x: auto;
      margin: 0.8em 0;
    }

    .preview-pane table {
      border-collapse: collapse;
      width: 100%;
      max-width: none;
      margin: 0;
      font-size: 0.9em;
    }

    .preview-pane th,
    .preview-pane td {
      border: 1px solid var(--color-border);
      padding: 0.4rem 0.75rem;
      text-align: left;
      /* Undo the pane-wide break-anywhere so cells wrap at word boundaries */
      overflow-wrap: normal;
      word-break: normal;
    }

    .preview-pane th {
      background: var(--color-surface);
      font-family: var(--font-mono);
      font-weight: 400;
      color: var(--color-text-light);
      font-size: 0.85em;
      white-space: nowrap;
    }

    .preview-pane .mermaid {
      background: var(--color-code-bg);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: 0.75rem;
      margin: 0.8em 0;
      text-align: center;
      overflow-x: auto;
    }
    .preview-pane .mermaid svg { max-width: 100%; height: auto; }
    /* Reserve vertical space while mermaid processes async — prevents the page
       from growing after the browser has restored scroll position on refresh. */
    .preview-pane .mermaid:not([data-processed="true"]) {
      min-height: 250px;
      color: transparent;
    }
  </style>
</head>
<body>
  <header>
    <a class="back-link" href="../index.html"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg> Back</a>
    <a class="site-title" href="../index.html">Dev Tools</a>
    <span class="header-spacer"></span>
    <a class="rail-link" href="https://github.com/gavin-meeker/dev-tools" target="_blank" rel="noopener" title="Source on GitHub" aria-label="Source on GitHub"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg></a>
    <button class="theme-toggle" id="theme-toggle" title="Toggle theme"></button>
  </header>

  <main class="wide">
    <div class="page-title-bar">
      <h1>Markdown preview</h1>
      <span class="page-note">render markdown live, with mermaid diagrams</span>
      <button class="btn-clear" onclick="saveToHash()"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg> Share</button>
    </div>
    <div class="tool-container">
      <div class="view-tabs" role="tablist" aria-label="View mode">
        <button type="button" data-view="compare" onclick="setView('compare')">Compare</button>
        <button type="button" data-view="preview" onclick="setView('preview')">Preview</button>
        <button type="button" data-view="text" onclick="setView('text')">Text</button>
      </div>
      <div class="split-view mode-compare" id="split-view">
        <div class="pane-input">
          <label for="input">Markdown</label>
          <div class="input-wrap">
            <textarea id="input" oninput="render()" placeholder="# Hello World

Write some **markdown** here..."></textarea>
            <button class="clear-icon" onclick="clearTool()" title="Clear"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
          </div>
        </div>
        <div class="pane-preview">
          <label>Preview</label>
          <div class="preview-pane" id="preview"></div>
        </div>
      </div>
    </div>
  </main>
  <footer>
    <span>Made by Gavin Meeker</span>
    <span id="share-timestamp"></span>
  </footer>

  <script>
    var VIEW_STORAGE_KEY = 'devtools:markdown-view';

    function setView(mode) {
      var sv = document.getElementById('split-view');
      sv.classList.remove('mode-compare', 'mode-preview', 'mode-text');
      sv.classList.add('mode-' + mode);
      document.querySelectorAll('.view-tabs button').forEach(function(b) {
        b.classList.toggle('active', b.dataset.view === mode);
      });
      try { localStorage.setItem(VIEW_STORAGE_KEY, mode); } catch (e) {}
      if (mode !== 'preview') autoResize();
    }

    function render() {
      const md = document.getElementById('input').value;
      document.getElementById('preview').innerHTML = parseMarkdown(md);
      autoResize();
      scheduleMermaid();
    }

    var _mermaidTimer = null;
    var _mermaidFirstRun = true;
    function scheduleMermaid() {
      if (!window.mermaid) return;
      // First render must be synchronous so the preview reaches its final height
      // before the browser restores scroll position — otherwise refresh causes
      // a visible top-then-jump. Subsequent keystrokes stay debounced.
      if (_mermaidFirstRun) {
        _mermaidFirstRun = false;
        runMermaid();
        return;
      }
      if (_mermaidTimer) clearTimeout(_mermaidTimer);
      _mermaidTimer = setTimeout(runMermaid, 200);
    }

    function runMermaid() {
      if (!window.mermaid) return;
      var nodes = document.querySelectorAll('#preview .mermaid:not([data-processed="true"])');
      if (!nodes.length) return;
      try {
        window.mermaid.run({ nodes: nodes, suppressErrors: true });
      } catch (e) { /* mermaid renders errors inline */ }
    }

    // Mermaid's own palettes don't match the site, so drive its base theme
    // from the same CSS variables the rest of the page uses.
    function mermaidConfig() {
      var css = getComputedStyle(document.documentElement);
      var v = function(name) { return css.getPropertyValue(name).trim(); };
      return {
        startOnLoad: false,
        securityLevel: 'strict',
        fontFamily: 'inherit',
        theme: 'base',
        themeVariables: {
          background: v('--color-recess'),
          primaryColor: v('--color-surface'),
          primaryTextColor: v('--color-text'),
          primaryBorderColor: v('--color-border'),
          secondaryColor: v('--color-surface'),
          tertiaryColor: v('--color-recess'),
          mainBkg: v('--color-surface'),
          nodeBorder: v('--color-accent'),
          lineColor: v('--color-text-light'),
          textColor: v('--color-text'),
          titleColor: v('--color-text'),
          clusterBkg: v('--color-recess'),
          clusterBorder: v('--color-border-soft'),
          edgeLabelBackground: v('--color-recess')
        }
      };
    }

    function initMermaid() {
      window.mermaid.initialize(mermaidConfig());
      runMermaid();
    }

    // Re-render mermaid diagrams when the theme toggles
    new MutationObserver(function() {
      if (!window.mermaid) return;
      window.mermaid.initialize(mermaidConfig());
      render();
    }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

    function autoResize() {
      const ta = document.getElementById('input');
      ta.style.height = 'auto';
      ta.style.height = ta.scrollHeight + 'px';
    }

    function _escapeHtml(s) {
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function initMarked() {
      if (!window.marked) return;
      window.marked.use({
        gfm: true,
        breaks: true,
        renderer: {
          // Intercept fenced code blocks so we can route ```mermaid``` to a
          // <div class="mermaid"> that mermaid.run() will convert to SVG.
          code({ text, lang, escaped }) {
            var esc = escaped ? text : _escapeHtml(text);
            if ((lang || '').trim().toLowerCase() === 'mermaid') {
              return '<div class="mermaid">' + esc + '</div>';
            }
            return '<pre><code>' + esc + '</code></pre>';
          }
        }
      });
    }

    function parseMarkdown(md) {
      if (!window.marked) return _escapeHtml(md);
      var html = window.marked.parse(md);
      // Turn every soft line-break into a visible blank line
      html = html.replace(/<br\s*\/?>/g, '<br><br>');
      // Give each table its own horizontal scroll container
      return html.replace(/<table>[\s\S]*?<\/table>/g, function(t) {
        return '<div class="table-scroll">' + t + '</div>';
      });
    }

    // Initialize with sample content — only if there is no shared-link hash
    // and no autosaved content, otherwise those async restores would overwrite
    // the sample and cause a visible flash.
    (function() {
      var hasHash = location.hash && location.hash.length > 1;
      var hasAutosave = localStorage.getItem('devtools:' + location.pathname + ':input') !== null;
      if (hasHash || hasAutosave) return;
      document.getElementById('input').value = `# Markdown Preview

## Features

This is a **live** markdown previewer. It supports:

- **Bold** and *italic* text
- ~~Strikethrough~~
- [Links](https://example.com)
- Inline \`code\` spans

### Code Blocks

\`\`\`js
function greet(name) {
  return "Hello, " + name;
}
\`\`\`

### Diagrams (Mermaid)

\`\`\`mermaid
flowchart LR
  A[Write markdown] --> B{Render}
  B --> C[Preview]
  B --> D[Diagram]
\`\`\`

### Blockquotes

> This is a blockquote.
> It can span multiple lines.

### Tables

| Feature | Supported |
|---------|-----------|
| Headings | Yes |
| Lists | Yes |
| Tables | Yes |

---

*Rendered entirely client-side with vanilla JS.*`;
    })();
  </script>
<script src="../shared.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/16.3.0/lib/marked.umd.min.js"
          integrity="sha384-28tGVU6cfNCYHN01DPkRbQ5zNcqr7cHx7RE2PA0Os8oQsE0H1dRIJBoGPX75oXDs"
          crossorigin="anonymous"
          referrerpolicy="no-referrer"
          onload="initMarked()"></script>
  <script src="../autosave.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/11.12.0/mermaid.min.js"
          integrity="sha384-o+g/BxPwhi0C3RK7oQBxQuNimeafQ3GE/ST4iT2BxVI4Wzt60SH4pq9iXVYujjaS"
          crossorigin="anonymous"
          referrerpolicy="no-referrer"
          onload="initMermaid()"></script>
  <script>
    (function initView() {
      var saved = null;
      try { saved = localStorage.getItem(VIEW_STORAGE_KEY); } catch (e) {}
      var defaultView = window.innerWidth <= 700 ? 'preview' : 'compare';
      setView(saved || defaultView);
    })();
    render();
    loadFromHash();
  </script>
</body>
</html>
