<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <title>Join Lines - Dev Tools</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <header>
    <a class="back-link" href="../index.html"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg> Back</a>
    <a class="site-title" href="../index.html">Dev Tools</a>
    <span class="header-spacer"></span>
    <button class="theme-toggle" id="theme-toggle" title="Toggle theme"></button>
  </header>

  <main>
    <div class="page-title-bar">
      <h1>Join Lines</h1>
      <button class="btn-clear" onclick="saveToHash()"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg> Share</button>
    </div>
    <div class="tool-container">
      <label for="input">Input (one item per line)</label>
      <div class="input-wrap">
        <textarea id="input" placeholder="Line 1&#10;Line 2&#10;Line 3"></textarea>
        <button class="clear-icon" onclick="clearTool()" title="Clear"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>

      <label for="delimiter">Delimiter</label>
      <div class="btn-row" style="align-items: center; margin-bottom: 1rem;">
        <input type="text" id="delimiter" value=", " style="width: 120px; padding: 0.5rem; border: 1px solid var(--color-border); border-radius: var(--radius); font-family: monospace; font-size: 0.95rem;">
        <button onclick="setDelim(', ')">comma</button>
        <button onclick="setDelim('; ')">semicolon</button>
        <button onclick="setDelim(' ')">space</button>
        <button onclick="setDelim('\t')">tab</button>
        <button onclick="setDelim('|')">pipe</button>
      </div>

      <label for="wrap-char">Wrap each line in</label>
      <div style="margin-bottom: 1rem;">
        <input type="text" id="wrap-char" value="" placeholder='e.g. " or ( or [' style="width: 180px; padding: 0.5rem; border: 1px solid var(--color-border); border-radius: var(--radius); font-family: monospace; font-size: 0.95rem;">
      </div>

      <div class="btn-row">
        <button onclick="joinLines()">Join</button>
        <label style="font-weight: normal; display: flex; align-items: center; gap: 0.3rem;">
          <input type="checkbox" id="trim-lines" checked> Trim each line
        </label>
        <label style="font-weight: normal; display: flex; align-items: center; gap: 0.3rem;">
          <input type="checkbox" id="skip-empty" checked> Skip empty lines
        </label>
      </div>

      <div class="output-area">
        <label>Output</label>
        <div class="output-wrap">
          <pre id="output"></pre>
          <button class="copy-icon" onclick="copyOutput()" title="Copy"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
        </div>
      </div>
    </div>
  </main>
<footer>Made by Gavin Meeker</footer>

  <script>
    const closingPairs = { '(': ')', '[': ']', '{': '}', '<': '>' };

    function setDelim(value) {
      document.getElementById('delimiter').value = value;
    }

function joinLines() {
      const input = document.getElementById('input').value;
      const delimiter = document.getElementById('delimiter').value;
      const trimLines = document.getElementById('trim-lines').checked;
      const skipEmpty = document.getElementById('skip-empty').checked;
      const wrapChar = document.getElementById('wrap-char').value;

      let lines = input.split('\n');
      if (trimLines) lines = lines.map(l => l.trim());
      if (skipEmpty) lines = lines.filter(l => l !== '');

      if (wrapChar) {
        const open = wrapChar;
        const close = closingPairs[wrapChar] || wrapChar;
        lines = lines.map(l => open + l + close);
      }

      document.getElementById('output').textContent = lines.join(delimiter);
    }

    function copyOutput() {
      copyToClipboard(document.getElementById('output').textContent);
    }
  </script>
<script src="../shared.js"></script>
  <script>
    loadFromHash();
  </script>
<script src="../autosave.js"></script>
</body>
</html>
