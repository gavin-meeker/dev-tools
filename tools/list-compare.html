<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <title>List Compare - Dev Tools</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Chivo+Mono:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css">
  <style>
    .lc-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1rem;
      margin-bottom: 1rem;
    }
    @media (max-width: 43.75rem) {
      .lc-grid { grid-template-columns: minmax(0, 1fr); }
    }
    .lc-pane[hidden] { display: none; }
    .lc-pane textarea { margin-bottom: 0; }
    .lc-pane-head {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      margin-bottom: 0.35rem;
    }
    .lc-pane-head input[type="text"] {
      flex: 1;
      min-width: 0;
      padding: 0.4rem 0.5rem;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .lc-pane-remove {
      background: none;
      color: var(--color-text-light);
      padding: 0.25rem;
      line-height: 0;
      border-radius: var(--radius-sm);
    }
    .lc-pane-remove[hidden] { display: none; }
    .lc-pane-remove:hover { background: none; color: var(--color-error); }
    .lc-pane-remove svg {
      width: 1rem;
      height: 1rem;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
    }
    .lc-inputs.collapsed .lc-grid,
    .lc-inputs.collapsed .lc-add-row { display: none; }

    /* Summary: totals/only-in-list gauges, plus a quiet per-list readout line */
    .lc-summary { margin-bottom: 1.1rem; }
    .lc-summary-rows {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
      margin-top: 0.6rem;
      font-family: var(--font-mono);
      font-size: 0.78rem;
      color: var(--color-text-light);
    }
    .lc-summary-rows strong { color: var(--color-text); font-weight: 500; }
    .lc-summary-note { opacity: 0.8; }

    .lc-table-wrap {
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      overflow: auto;
      max-height: 70vh;
      max-width: 46rem;
      background: var(--color-recess);
    }
    .lc-table {
      width: 100%;
      border-collapse: collapse;
      font-family: var(--font-mono);
      font-size: 0.82rem;
    }
    .lc-table th, .lc-table td {
      padding: 0.3rem 0.65rem;
      text-align: left;
      border-bottom: 1px solid var(--color-border-soft);
    }
    .lc-table thead th {
      position: sticky;
      top: 0;
      background: var(--color-surface);
      color: var(--color-text-light);
      font-weight: 400;
      font-size: 0.72rem;
      border-bottom: 1px solid var(--color-border);
      z-index: 1;
    }
    .lc-col-mark { width: 1%; white-space: nowrap; text-align: center !important; font-variant-numeric: tabular-nums; }
    .lc-mark {
      font-weight: 500;
      font-size: 0.95rem;
      line-height: 1;
    }
    .lc-mark-yes { color: var(--color-diff-added-text); }
    .lc-mark-no { color: var(--color-diff-removed-text); opacity: 0.55; }
    .lc-item { word-break: break-all; color: var(--color-text); }

    .lc-section-row td {
      background: var(--color-surface);
      border-top: 1px solid var(--color-border);
      border-bottom: 1px solid var(--color-border);
      padding: 0;
    }
    .lc-section {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 0.65rem;
      font-family: var(--font-mono);
    }
    .lc-section-title {
      font-weight: 500;
      font-size: 0.78rem;
      color: var(--color-text);
    }
    .lc-section-count {
      color: var(--color-text-light);
      font-size: 0.75rem;
      font-variant-numeric: tabular-nums;
    }
    .lc-section-copy {
      margin-left: auto;
      background: none;
      color: var(--color-text-light);
      padding: 0.125rem 0.45rem;
      font-family: var(--font-sans);
      font-size: 0.72rem;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
    }
    .lc-section-copy:hover { background: var(--color-recess); color: var(--color-accent); border-color: var(--color-text-light); }

    #add-list:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    #add-list:disabled:hover { background: var(--color-accent); }

    .lc-placeholder {
      color: var(--color-text-light);
      font-size: 0.88rem;
      padding: 2.2rem 0;
      text-align: center;
      border: 1px dashed var(--color-border);
      border-radius: var(--radius);
    }
  </style>
</head>
<body>
  <header>
    <a class="back-link" href="../index.html"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg> Back</a>
    <a class="site-title" href="../index.html">Dev Tools</a>
    <span class="header-spacer"></span>
    <a class="rail-link" href="https://github.com/gavin-meeker/dev-tools" target="_blank" rel="noopener" title="Source on GitHub" aria-label="Source on GitHub"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg></a>
    <button class="theme-toggle" id="theme-toggle" title="Toggle theme"></button>
  </header>

  <main class="wide">
    <div class="page-title-bar">
      <h1>List compare</h1>
      <span class="page-note">find what's shared and what's unique across 2-5 lists</span>
      <button class="btn-clear" onclick="saveToHash()"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg> Share</button>
    </div>
    <div class="tool-container">
      <div class="lc-inputs" id="inputs">
        <div class="lc-grid" id="list-grid">
          <!-- All five panes exist up front so shared.js (share links) and autosave.js,
               which both bind to elements present at load, cover every list. Panes past
               the active count are hidden, not absent. -->
          <div class="lc-pane" id="pane-0">
            <div class="lc-pane-head">
              <input type="text" id="name-a" value="List A" aria-label="Name for list 1">
              <button class="lc-pane-remove" onclick="removeList(0)" title="Remove list"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
            </div>
            <textarea id="list-a" placeholder="One item per line..."></textarea>
          </div>
          <div class="lc-pane" id="pane-1">
            <div class="lc-pane-head">
              <input type="text" id="name-b" value="List B" aria-label="Name for list 2">
              <button class="lc-pane-remove" onclick="removeList(1)" title="Remove list"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
            </div>
            <textarea id="list-b" placeholder="One item per line..."></textarea>
          </div>
          <div class="lc-pane" id="pane-2" hidden>
            <div class="lc-pane-head">
              <input type="text" id="name-c" value="List C" aria-label="Name for list 3">
              <button class="lc-pane-remove" onclick="removeList(2)" title="Remove list"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
            </div>
            <textarea id="list-c" placeholder="One item per line..."></textarea>
          </div>
          <div class="lc-pane" id="pane-3" hidden>
            <div class="lc-pane-head">
              <input type="text" id="name-d" value="List D" aria-label="Name for list 4">
              <button class="lc-pane-remove" onclick="removeList(3)" title="Remove list"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
            </div>
            <textarea id="list-d" placeholder="One item per line..."></textarea>
          </div>
          <div class="lc-pane" id="pane-4" hidden>
            <div class="lc-pane-head">
              <input type="text" id="name-e" value="List E" aria-label="Name for list 5">
              <button class="lc-pane-remove" onclick="removeList(4)" title="Remove list"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
            </div>
            <textarea id="list-e" placeholder="One item per line..."></textarea>
          </div>
        </div>
        <div class="btn-row lc-add-row">
          <button class="btn-quiet" id="add-list" onclick="addList()">Add list</button>
        </div>
      </div>

      <div class="btn-row">
        <button onclick="compare()">Compare</button>
        <button class="btn-quiet" id="toggle-inputs" onclick="toggleInputs()">Hide inputs</button>
        <button class="btn-quiet" onclick="clearAll()">Clear</button>
        <label style="font-weight: normal; text-transform: none; display: flex; align-items: center; gap: 0.3rem; margin-bottom: 0;">
          <input type="checkbox" id="case-insensitive"> Ignore case
        </label>
      </div>

      <div id="summary"></div>
      <div id="results"></div>
      <div class="lc-placeholder" id="placeholder">Paste your lists above, then press Compare to see what's shared and what's unique.</div>
      <div class="btn-row" id="export-row" style="margin-top: 1rem;" hidden>
        <button class="btn-quiet" onclick="copyTsv()">Copy table (TSV)</button>
      </div>
    </div>
  </main>
  <footer>
    <span>Made by Gavin Meeker</span>
    <span id="share-timestamp"></span>
  </footer>

  <script>
    const MAX_LISTS = 5;
    const SUFFIXES = ['a', 'b', 'c', 'd', 'e'];
    const COUNT_KEY = 'devtools:' + location.pathname + ':list-count';

    let listCount = 2;
    let lastSections = null;
    let lastLists = null;

    const defaultName = (i) => 'List ' + SUFFIXES[i].toUpperCase();
    const nameEl = (i) => document.getElementById('name-' + SUFFIXES[i]);
    const textEl = (i) => document.getElementById('list-' + SUFFIXES[i]);

    // ---- List panes ----

    function setListCount(n) {
      listCount = Math.min(MAX_LISTS, Math.max(2, n));
      for (let i = 0; i < MAX_LISTS; i++) {
        document.getElementById('pane-' + i).hidden = i >= listCount;
      }
      document.getElementById('add-list').disabled = listCount >= MAX_LISTS;
      document.querySelectorAll('.lc-pane-remove').forEach((btn, i) => {
        btn.hidden = !(listCount > 2 && i < listCount);
      });
      localStorage.setItem(COUNT_KEY, String(listCount));
      clearResults();
    }

    function addList() {
      if (listCount < MAX_LISTS) setListCount(listCount + 1);
    }

    // Shifts the panes after `index` up so ids stay tied to position; default names
    // follow the slot they land in rather than the one they were typed against.
    function removeList(index) {
      if (listCount <= 2) return;
      const kept = [];
      for (let i = 0; i < listCount; i++) {
        if (i !== index) kept.push({ name: nameEl(i).value, text: textEl(i).value, from: i });
      }
      kept.forEach((entry, i) => {
        setValue(nameEl(i), entry.name === defaultName(entry.from) ? defaultName(i) : entry.name);
        setValue(textEl(i), entry.text);
      });
      setValue(nameEl(listCount - 1), defaultName(listCount - 1));
      setValue(textEl(listCount - 1), '');
      setListCount(listCount - 1);
    }

    function setValue(el, value) {
      el.value = value;
      el.dispatchEvent(new Event('input', { bubbles: true }));
    }

    function toggleInputs() {
      const collapsed = document.getElementById('inputs').classList.toggle('collapsed');
      document.getElementById('toggle-inputs').textContent = collapsed ? 'Show inputs' : 'Hide inputs';
    }

    function clearAll() {
      clearTool();
      for (let i = 0; i < MAX_LISTS; i++) setValue(nameEl(i), defaultName(i));
      clearResults();
    }

    function clearResults() {
      lastSections = null;
      lastLists = null;
      document.getElementById('summary').innerHTML = '';
      document.getElementById('results').innerHTML = '';
      document.getElementById('export-row').hidden = true;
      document.getElementById('placeholder').hidden = false;
    }

    // ---- Comparison ----

    function compare() {
      const ignoreCase = document.getElementById('case-insensitive').checked;
      const lists = [];
      for (let i = 0; i < listCount; i++) {
        const lines = textEl(i).value.split('\n').map(l => l.trim()).filter(l => l !== '');
        lists.push({
          name: nameEl(i).value.trim() || defaultName(i),
          lines: lines,
          lineCount: lines.length,
          unique: 0,
          only: 0
        });
      }

      // key -> { display, mask, variants } where mask bit i means "present in list i"
      const items = new Map();
      lists.forEach((list, i) => {
        const seen = new Set();
        list.lines.forEach(line => {
          const key = ignoreCase ? line.toLowerCase() : line;
          if (seen.has(key)) return;
          seen.add(key);
          list.unique++;
          let item = items.get(key);
          if (!item) {
            item = { display: line, mask: 0, variants: new Set() };
            items.set(key, item);
          }
          item.mask |= 1 << i;
          item.variants.add(line);
        });
      });

      const rows = Array.from(items.values());
      rows.forEach(row => {
        const onlyIn = onlyListIndex(row.mask);
        if (onlyIn >= 0) lists[onlyIn].only++;
      });
      rows.sort((a, b) => {
        const x = a.display.toLowerCase(), y = b.display.toLowerCase();
        return x < y ? -1 : x > y ? 1 : 0;
      });

      const allMask = (1 << listCount) - 1;
      const sections = [{ title: 'In all ' + listCount + ' lists', rows: rows.filter(r => r.mask === allMask) }];
      lists.forEach((list, i) => {
        sections.push({ title: 'Only in ' + list.name, rows: rows.filter(r => r.mask === (1 << i)) });
      });
      sections.push({
        title: 'In some lists',
        rows: rows.filter(r => r.mask !== allMask && onlyListIndex(r.mask) < 0)
      });

      lastLists = lists;
      lastSections = sections;
      renderSummary(lists, rows.length, sections[0].rows.length);
      renderTable(lists, sections);
      document.getElementById('placeholder').hidden = true;
      document.getElementById('export-row').hidden = false;
    }

    // Returns the single list index when `mask` has exactly one bit set, else -1.
    function onlyListIndex(mask) {
      return (mask & (mask - 1)) === 0 ? Math.log2(mask) : -1;
    }

    function renderSummary(lists, totalDistinct, inAll) {
      let gauges = '<div class="gauges">'
        + '<div class="gauge"><span class="n">' + totalDistinct + '</span><span class="l">total distinct</span></div>'
        + '<div class="gauge add"><span class="n">' + inAll + '</span><span class="l">in all ' + lists.length + ' lists</span></div>';
      lists.forEach(list => {
        gauges += '<div class="gauge"><span class="n">' + list.only + '</span><span class="l">' + esc(list.name) + ' only</span></div>';
      });
      gauges += '</div>';

      const rows = lists.map(list => {
        const dupes = list.lineCount - list.unique;
        const note = dupes > 0 ? ' <span class="lc-summary-note">(' + dupes + ' duplicate' + (dupes === 1 ? '' : 's') + ' ignored)</span>' : '';
        return '<div><strong>' + esc(list.name) + '</strong> &mdash; ' +
          list.lineCount + ' line' + (list.lineCount === 1 ? '' : 's') + ', ' +
          list.unique + ' unique value' + (list.unique === 1 ? '' : 's') + note + '</div>';
      }).join('');

      document.getElementById('summary').innerHTML = '<div class="lc-summary">' + gauges +
        '<div class="lc-summary-rows">' + rows + '</div></div>';
    }

    function renderTable(lists, sections) {
      const cols = lists.length + 1;
      let html = '<div class="lc-table-wrap"><table class="lc-table"><thead><tr><th>Item</th>';
      lists.forEach(list => { html += '<th class="lc-col-mark">' + esc(list.name) + '</th>'; });
      html += '</tr></thead><tbody>';

      sections.forEach((section, si) => {
        if (!section.rows.length) return;
        html += '<tr class="lc-section-row"><td colspan="' + cols + '"><div class="lc-section">' +
          '<span class="lc-section-title">' + esc(section.title) + '</span>' +
          '<span class="lc-section-count">' + section.rows.length + '</span>' +
          '<button class="lc-section-copy" onclick="copySection(' + si + ')">Copy</button>' +
          '</div></td></tr>';
        section.rows.forEach(row => {
          const variants = Array.from(row.variants);
          const title = variants.length > 1 ? ' title="Variants: ' + esc(variants.join(', ')) + '"' : '';
          html += '<tr><td class="lc-item"' + title + '>' + esc(row.display) + '</td>';
          for (let i = 0; i < lists.length; i++) {
            html += '<td class="lc-col-mark">' + ((row.mask & (1 << i))
              ? '<span class="lc-mark lc-mark-yes">&#10003;</span>'
              : '<span class="lc-mark lc-mark-no">&ndash;</span>') + '</td>';
          }
          html += '</tr>';
        });
      });

      html += '</tbody></table></div>';
      document.getElementById('results').innerHTML = html;
    }

    function esc(s) {
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // ---- Export ----

    function copySection(index) {
      if (!lastSections) return;
      copyToClipboard(lastSections[index].rows.map(r => r.display).join('\n'));
    }

    function copyTsv() {
      if (!lastSections) return;
      const rows = [['Item'].concat(lastLists.map(l => l.name)).concat(['Group']).join('\t')];
      lastSections.forEach(section => {
        section.rows.forEach(row => {
          const marks = lastLists.map((_, i) => (row.mask & (1 << i)) ? 'yes' : '');
          rows.push([row.display].concat(marks).concat([section.title]).join('\t'));
        });
      });
      copyToClipboard(rows.join('\n'));
    }

    // Both autosave and share-link restore dispatch `input`, so revealing a pane when
    // content lands in it is enough to bring back lists C-E from either source.
    for (let i = 2; i < MAX_LISTS; i++) {
      textEl(i).addEventListener('input', function() {
        if (this.value && i >= listCount) setListCount(i + 1);
      });
    }

    setListCount(parseInt(localStorage.getItem(COUNT_KEY), 10) || 2);
  </script>
<script src="../shared.js"></script>
  <script>
    loadFromHash();
  </script>
<script src="../autosave.js"></script>
</body>
</html>
