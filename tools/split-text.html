<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Split Text - Dev Tools</title>
  <link rel="stylesheet" href="../styles.css">
</head>
<body>
  <header>
    <a class="site-title" href="../index.html">Dev Tools</a>
    <nav><a href="../index.html">All Tools</a></nav>
  </header>

  <main>
    <h1>Split Text</h1>
    <div class="tool-container">
      <label for="input">Input</label>
      <textarea id="input" placeholder="Text to split..."></textarea>

      <label for="delimiter">Delimiter</label>
      <div class="btn-row" style="align-items: center; margin-bottom: 1rem;">
        <input type="text" id="delimiter" value=", " style="width: 120px; padding: 0.5rem; border: 1px solid var(--color-border); border-radius: var(--radius); font-family: monospace; font-size: 0.95rem;">
        <button onclick="setDelim(', ')">comma</button>
        <button onclick="setDelim('; ')">semicolon</button>
        <button onclick="setDelim(' ')">space</button>
        <button onclick="setDelim('\t')">tab</button>
        <button onclick="setDelim('|')">pipe</button>
      </div>

      <div class="btn-row">
        <button onclick="splitText()">Split</button>
        <label style="font-weight: normal; display: flex; align-items: center; gap: 0.3rem;">
          <input type="checkbox" id="trim-parts" checked> Trim each part
        </label>
        <label style="font-weight: normal; display: flex; align-items: center; gap: 0.3rem;">
          <input type="checkbox" id="skip-empty" checked> Skip empty parts
        </label>
      </div>

      <div class="output-area">
        <label>Output (one item per line)</label>
        <div class="output-wrap">
          <pre id="output"></pre>
          <button class="copy-icon" onclick="copyOutput(this)" title="Copy"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
        </div>
      </div>
    </div>
  </main>
<footer>Made by Gavin Meeker</footer>

  <script>
    function setDelim(value) {
      document.getElementById('delimiter').value = value;
    }

    function splitText() {
      const input = document.getElementById('input').value;
      const delimiter = document.getElementById('delimiter').value;
      const trimParts = document.getElementById('trim-parts').checked;
      const skipEmpty = document.getElementById('skip-empty').checked;

      let parts = input.split(delimiter);
      if (trimParts) parts = parts.map(p => p.trim());
      if (skipEmpty) parts = parts.filter(p => p !== '');

      document.getElementById('output').textContent = parts.join('\n');
    }

    function copyOutput(btn) {
      const text = document.getElementById('output').textContent;
      if (!text) return;
      navigator.clipboard.writeText(text);
      btn.classList.add('copied');
      setTimeout(() => btn.classList.remove('copied'), 1500);
    }
  </script>
</body>
</html>
