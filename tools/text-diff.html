</head>
<body>
  <header>
    <a class="back-link" href="../index.html"><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg> Back</a>
    <a class="site-title" href="../index.html">Dev Tools</a>
    <span class="header-spacer"></span>
    <a class="rail-link" href="https://github.com/gavin-meeker/dev-tools" target="_blank" rel="noopener" title="Source on GitHub" aria-label="Source on GitHub"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg></a>
    <button class="theme-toggle" id="theme-toggle" title="Toggle theme"></button>
  </header>

  <main class="wide">
    <div class="page-title-bar">
      <h1>Text diff</h1>
      <span class="page-note">line by line, then character by character</span>
      <button class="btn-clear" onclick="saveToHash()"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg> Share</button>
    </div>
    <div class="tool-container">
      <div class="dual-input">
        <div>
          <label for="input-left">Original</label>
          <div class="input-wrap">
            <textarea id="input-left" placeholder="Paste original text..."></textarea>
            <button class="clear-icon" onclick="clearTool()" title="Clear"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
          </div>
        </div>
        <div>
          <label for="input-right">Modified</label>
          <textarea id="input-right" placeholder="Paste modified text..."></textarea>
        </div>
      </div>

      <div class="btn-row" style="align-items: center;">
        <button onclick="compare()">Compare</button>
        <label class="opt"><input type="checkbox" id="ignore-whitespace"> Ignore leading and trailing whitespace</label>
        <label class="opt"><input type="checkbox" id="ignore-case"> Ignore case</label>
      </div>

      <div class="output-area" id="output"></div>
    </div>
  </main>
<footer>
    <span>Made by Gavin Meeker</span>
    <span id="share-timestamp"></span>
  </footer>

  <script>
    function compare() {
      const output = document.getElementById('output');
      const ignoreWS = document.getElementById('ignore-whitespace').checked;
      const ignoreCase = document.getElementById('ignore-case').checked;

      const leftRaw = document.getElementById('input-left').value.split('\n');
      const rightRaw = document.getElementById('input-right').value.split('\n');

      // Prepare comparison versions (may differ from display versions)
      const leftCmp = leftRaw.map(l => {
        let s = l;
        if (ignoreWS) s = s.trim();
        if (ignoreCase) s = s.toLowerCase();
        return s;
      });
      const rightCmp = rightRaw.map(l => {
        let s = l;
        if (ignoreWS) s = s.trim();
        if (ignoreCase) s = s.toLowerCase();
        return s;
      });

      const diff = myersDiff(leftCmp, rightCmp);

      if (diff.every(d => d.type === 'unchanged')) {
        output.innerHTML = '<p class="match-msg">The two texts are identical.</p>';
        return;
      }

      // Map diff back to original lines for display
      let li = 0, ri = 0;
      const displayDiff = diff.map(d => {
        if (d.type === 'removed') {
          return { type: 'removed', value: leftRaw[li++] };
        } else if (d.type === 'added') {
          return { type: 'added', value: rightRaw[ri++] };
        } else {
          li++; ri++;
          return { type: 'unchanged', value: leftRaw[li - 1] };
        }
      });

      // Build paired rows for side-by-side
      const rows = [];
      let i = 0;
      while (i < displayDiff.length) {
        const d = displayDiff[i];
        if (d.type === 'unchanged') {
          rows.push({
            left: { type: 'unchanged', value: d.value },
            right: { type: 'unchanged', value: d.value },
          });
          i++;
        } else if (d.type === 'removed') {
          const removed = [];
          while (i < displayDiff.length && displayDiff[i].type === 'removed') {
            removed.push(displayDiff[i].value);
            i++;
          }
          const added = [];
          while (i < displayDiff.length && displayDiff[i].type === 'added') {
            added.push(displayDiff[i].value);
            i++;
          }
          const maxLen = Math.max(removed.length, added.length);
          for (let j = 0; j < maxLen; j++) {
            const rem = j < removed.length ? removed[j] : null;
            const add = j < added.length ? added[j] : null;
            if (rem !== null && add !== null) {
              // Paired change — run a char-level diff so only the differing
              // chars get the stronger highlight
              const cd = charDiff(rem, add);
              rows.push({
                left: { type: 'removed', value: renderCharDiffSide(cd, 'left'), isHtml: true },
                right: { type: 'added', value: renderCharDiffSide(cd, 'right'), isHtml: true },
              });
            } else {
              rows.push({
                left: rem !== null ? { type: 'removed', value: rem } : { type: 'empty', value: '' },
                right: add !== null ? { type: 'added', value: add } : { type: 'empty', value: '' },
              });
            }
          }
        } else if (d.type === 'added') {
          rows.push({
            left: { type: 'empty', value: '' },
            right: { type: 'added', value: d.value },
          });
          i++;
        }
      }

      // Render
      let leftNum = 0, rightNum = 0;
      let leftHtml = '', rightHtml = '';
      for (const row of rows) {
        if (row.left.type === 'unchanged' || row.left.type === 'removed') leftNum++;
        const lNum = row.left.type === 'empty' ? '' : leftNum;
        leftHtml += renderLine(row.left.type, lNum, row.left.value, row.left.isHtml);

        if (row.right.type === 'unchanged' || row.right.type === 'added') rightNum++;
        const rNum = row.right.type === 'empty' ? '' : rightNum;
        rightHtml += renderLine(row.right.type, rNum, row.right.value, row.right.isHtml);
      }

      const addedCount = displayDiff.filter(d => d.type === 'added').length;
      const removedCount = displayDiff.filter(d => d.type === 'removed').length;
      const unchangedCount = displayDiff.filter(d => d.type === 'unchanged').length;
      const summary = '<div class="gauges">'
        + '<div class="gauge add"><span class="n">' + addedCount + '</span><span class="l">added</span></div>'
        + '<div class="gauge del"><span class="n">' + removedCount + '</span><span class="l">removed</span></div>'
        + '<div class="gauge"><span class="n">' + unchangedCount + '</span><span class="l">unchanged</span></div>'
        + '</div>';

      output.innerHTML = summary
        + '<div class="diff-view">'
        + '<div class="diff-side"><div class="diff-side-header"><span>original</span><span>' + leftNum + ' lines</span></div>' + leftHtml + '</div>'
        + '<div class="diff-side"><div class="diff-side-header"><span>modified</span><span>' + rightNum + ' lines</span></div>' + rightHtml + '</div>'
        + '</div>';

      // Sync scrolling
      const sides = output.querySelectorAll('.diff-side');
      let syncing = false;
      sides.forEach((side, idx) => {
        side.addEventListener('scroll', () => {
          if (syncing) return;
          syncing = true;
          const other = sides[idx === 0 ? 1 : 0];
          other.scrollTop = side.scrollTop;
          other.scrollLeft = side.scrollLeft;
          syncing = false;
        });
      });
    }

    function renderLine(type, num, value, isHtml) {
      return '<div class="diff-line ' + type + '">'
        + '<span class="diff-line-num">' + num + '</span>'
        + '<span class="diff-line-content">' + (isHtml ? value : escapeHtml(value)) + '</span>'
        + '</div>';
    }

    // Character-level Myers diff for a paired line change.
    // Falls back to whole-line highlighting if either side is very long, since
    // Myers is O(N*M) worst case and blows up on long lines.
    function charDiff(a, b) {
      const CAP = 2000;
      if (a.length > CAP || b.length > CAP) {
        return [
          { type: 'removed', value: a },
          { type: 'added', value: b },
        ];
      }
      return myersDiff(Array.from(a), Array.from(b));
    }

    function renderCharDiffSide(diff, side) {
      // side: 'left' shows unchanged + removed; 'right' shows unchanged + added
      // Coalesce consecutive same-type chars into a single span so rounded
      // corners on the highlight don't fragment the visual run.
      let html = '';
      let i = 0;
      while (i < diff.length) {
        const type = diff[i].type;
        let run = '';
        while (i < diff.length && diff[i].type === type) {
          run += diff[i].value;
          i++;
        }
        if (type === 'unchanged') {
          html += escapeHtml(run);
        } else if (type === 'removed' && side === 'left') {
          html += '<span class="diff-char-removed">' + escapeHtml(run) + '</span>';
        } else if (type === 'added' && side === 'right') {
          html += '<span class="diff-char-added">' + escapeHtml(run) + '</span>';
        }
      }
      return html;
    }

    function myersDiff(left, right) {
      const N = left.length;
      const M = right.length;
      const MAX = N + M;
      const v = new Array(2 * MAX + 1);
      v[MAX + 1] = 0;
      const trace = [];

      for (let d = 0; d <= MAX; d++) {
        const newV = v.slice();
        for (let k = -d; k <= d; k += 2) {
          let x;
          if (k === -d || (k !== d && v[MAX + k - 1] < v[MAX + k + 1])) {
            x = v[MAX + k + 1];
          } else {
            x = v[MAX + k - 1] + 1;
          }
          let y = x - k;
          while (x < N && y < M && left[x] === right[y]) {
            x++;
            y++;
          }
          newV[MAX + k] = x;
          if (x >= N && y >= M) {
            trace.push(newV);
            return backtrack(trace, MAX, left, right);
          }
        }
        trace.push(newV.slice());
        for (let k = -d; k <= d; k += 2) {
          v[MAX + k] = newV[MAX + k];
        }
      }
      return [];
    }

    function backtrack(trace, MAX, left, right) {
      let x = left.length;
      let y = right.length;
      const result = [];

      for (let d = trace.length - 1; d >= 0; d--) {
        const v = trace[d];
        const k = x - y;
        let prevK;
        if (k === -d || (k !== d && (d === 0 ? -1 : trace[d-1][MAX + k - 1]) < (d === 0 ? -1 : trace[d-1][MAX + k + 1]))) {
          prevK = k + 1;
        } else {
          prevK = k - 1;
        }

        const prevX = d === 0 ? 0 : trace[d - 1][MAX + prevK];
        const prevY = prevX - prevK;

        while (x > prevX && y > prevY) {
          x--;
          y--;
          result.push({ type: 'unchanged', value: left[x] });
        }

        if (d > 0) {
          if (x === prevX) {
            result.push({ type: 'added', value: right[y - 1] });
            y--;
          } else {
            result.push({ type: 'removed', value: left[x - 1] });
            x--;
          }
        }
      }

      return result.reverse();
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }
  </script>
<script src="../shared.js"></script>
